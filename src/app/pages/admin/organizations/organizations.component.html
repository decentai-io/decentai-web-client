<app-page guide="admin#organizations" title="Organization" sentence="The boundary everything else lives inside: its people, groups, policies and data.">
  <div class="form" *ngIf="loading" aria-busy="true" aria-label="Reading the organization">
    <span class="sk sk-field"></span>
  </div>

  <p class="form-notice is-error" role="alert" *ngIf="loadError">{{ loadError }}</p>

  <ng-container *ngIf="!loading && organization as org">
    <!-- Its name, and when it began. -->
    <form class="ui-panel admin-panel" (ngSubmit)="save()" aria-labelledby="org-name-title">
      <div class="ui-panel-head">
        <h2 class="ui-panel-title" id="org-name-title">{{ org.name }}</h2>
        <span class="ui-pill" *ngIf="created"><lucide-icon name="calendar" [size]="12" aria-hidden="true"></lucide-icon>Created {{ created }}</span>
        <span class="ui-pill" *ngIf="!canRename"><lucide-icon name="lock" [size]="12" aria-hidden="true"></lucide-icon>Read only</span>
      </div>
      <app-field label="Name" help="Shown to everyone in the organization."
                 [error]="tried && !name.trim() ? 'Give the organization a name.' : ''">
        <input class="input" name="org-name" autocomplete="organization" [(ngModel)]="name" [readOnly]="!canRename" />
      </app-field>

      <app-save-bar *ngIf="canRename" [dirty]="dirty" [saving]="saving" [error]="saveError"
                    (save)="save()" (discard)="name = org.name"></app-save-bar>
    </form>

    <!-- What lives inside it: a card for each page this person may open. -->
    <section class="admin-hub" *ngIf="places.length" aria-labelledby="org-places-title">
      <h2 class="admin-section-title" id="org-places-title">Inside it</h2>
      <div class="ui-cards admin-cards">
        <a class="ui-card admin-card" *ngFor="let place of places" [routerLink]="place.link">
          <span class="admin-card-words">
            <span class="admin-card-name">{{ place.name }}</span>
            <span class="admin-card-line">{{ place.line }}</span>
          </span>
          <lucide-icon class="admin-card-go" name="arrow-right" [size]="16" aria-hidden="true"></lucide-icon>
        </a>
      </div>
    </section>
  </ng-container>
</app-page>
