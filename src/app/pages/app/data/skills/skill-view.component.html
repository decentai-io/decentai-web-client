<!-- Its header band: the skill's tile, its name, when it applies, and
     its facts as pills. -->
<header class="skill-head">
  <span class="skill-face" aria-hidden="true">
    <lucide-icon name="sparkles" [size]="22" [strokeWidth]="1.75"></lucide-icon>
  </span>
  <div class="skill-words">
    <h2 class="skill-title">{{ skill.name }}</h2>
    <p class="skill-summary">{{ skill.description }}</p>
    <p class="ui-pills skill-line">
      <span class="ui-pill" *ngIf="author">
        <lucide-icon name="circle-user" [size]="12" aria-hidden="true"></lucide-icon>By {{ author }}
      </span>
      <span class="ui-pill" *ngIf="written">
        <lucide-icon name="history" [size]="12" aria-hidden="true"></lucide-icon>written {{ written }}
      </span>
      <span class="ui-pill" [class.is-accent]="sharing !== 'Private'" *ngIf="sharing">
        <lucide-icon [name]="sharing === 'Private' ? 'lock' : 'users'" [size]="12" aria-hidden="true"></lucide-icon>{{ sharing }}
      </span>
    </p>
  </div>
  <button class="icon-btn sm skill-close" type="button" aria-label="Close the skill" (click)="closed.emit()">
    <lucide-icon name="x" [size]="16" aria-hidden="true"></lucide-icon>
  </button>
</header>

<div class="skill-actions">
  <ng-content select="[skillActions]"></ng-content>
</div>

<section class="skill-body" aria-labelledby="skill-body-title">
  <div class="ui-panel-head skill-body-head">
    <span class="ui-panel-icon is-hued"><lucide-icon name="book-open" [size]="16" aria-hidden="true"></lucide-icon></span>
    <h3 class="ui-panel-title" id="skill-body-title">The skill itself</h3>
  </div>
  <p class="skill-note">What the assistant reads once it decides this skill applies:</p>
  <markdown class="skill-text" [data]="body"></markdown>
</section>
