<header class="skill-head">
  <div class="skill-words">
    <h2 class="skill-title">{{ skill.name }}</h2>
    <p class="skill-summary">{{ skill.description }}</p>
    <p class="skill-line">
      <span *ngIf="author">By {{ author }}</span>
      <span *ngIf="written">written {{ written }}</span>
    </p>
  </div>
  <button class="icon-btn sm" type="button" aria-label="Close the skill" (click)="closed.emit()">
    <lucide-icon name="x" [size]="16" aria-hidden="true"></lucide-icon>
  </button>
</header>

<div class="skill-actions">
  <span class="chip" *ngIf="sharing">{{ sharing }}</span>
  <ng-content select="[skillActions]"></ng-content>
</div>

<div class="skill-body">
  <p class="skill-note">What the assistant reads once it decides this skill applies:</p>
  <markdown class="skill-text" [data]="body"></markdown>
</div>
