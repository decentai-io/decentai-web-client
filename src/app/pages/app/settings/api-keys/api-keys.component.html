<app-empty *ngIf="loadError" icon="cloud-off" title="API keys could not be loaded" [line]="loadError">
  <button class="btn" type="button" (click)="load()">Try again</button>
</app-empty>

<app-list *ngIf="!loadError" label="API keys" [loading]="loading" [foot]="keys.length ? foot : ''">
  <ng-container listToolbar *ngIf="!loading">
    <!-- The plus alone, at the list's top right, whether or not there
         are keys yet. -->
    <span class="toolbar-end" *ngIf="canCreate"
          [matTooltip]="atLimit ? 'Revoke a key to create another: ' + limit + ' is the most at once.' : 'Create a key'">
      <button class="icon-btn primary" type="button" aria-label="Create a key" [disabled]="atLimit" (click)="create()">
        <lucide-icon name="plus" [size]="18" aria-hidden="true"></lucide-icon>
      </button>
    </span>
  </ng-container>

  <p class="keys-error" role="alert" *ngIf="revokeError">{{ revokeError }}</p>

  <app-row *ngFor="let key of keys" [name]="key.name" [title]="datesInFull(key)">
    <lucide-icon rowMark name="key-round" [size]="20" [strokeWidth]="1.75" aria-hidden="true"></lucide-icon>
    <ng-container rowMeta>
      <code class="keys-prefix">{{ key.shown }}</code> · {{ created(key) }} · {{ used(key) }} · {{ expires(key) }}
    </ng-container>
    <button
      rowActions
      class="btn danger sm"
      type="button"
      *ngIf="canRevoke"
      [attr.aria-label]="'Revoke ' + key.name"
      [disabled]="busyId === key.key_id"
      (click)="revoke(key)"
    >
      {{ busyId === key.key_id ? "Revoking…" : "Revoke" }}
    </button>
  </app-row>

  <app-empty
    *ngIf="!keys.length"
    icon="key-round"
    title="No API keys yet"
    line="Create one when a script needs to act with your permissions. It is shown once, and lasts as long as you choose, up to a year."
  ></app-empty>
</app-list>
