<!-- Settings › Model providers, inside the shell, which shows its title. -->
<p class="form-notice is-error" role="alert" *ngIf="error">{{ error }}</p>
<p class="form-notice" role="status" *ngIf="notice">{{ notice }}</p>

<div class="form" *ngIf="loading" aria-busy="true" aria-label="Reading the providers">
  <span class="sk sk-field"></span>
  <span class="sk sk-field"></span>
</div>

<app-model-providers
  *ngIf="!loading"
  [connections]="connections"
  [pages]="pages"
  [connectionTotal]="all"
  [counts]="counts"
  [providers]="providers"
  [groups]="groups"
  (searched)="search($event)"
  (changed)="reload()"
></app-model-providers>
