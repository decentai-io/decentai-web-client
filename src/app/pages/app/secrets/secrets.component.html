<app-page guide="credentials"
  title="Secrets"
  sentence="What you store for your agents to act with. The values are encrypted, and never shown back."
  [wide]="true"
>
  <p class="form-notice is-error" role="alert" *ngIf="error">{{ error }}</p>
  <p class="form-notice" role="status" *ngIf="notice">{{ notice }}</p>
  <app-handed [records]="handed" [say]="handedSay" [busy]="busyRef" (answer)="accept($event.record, $event.yes)"></app-handed>

  <div class="side-layout" [class.has-opened]="opened">
    <app-filter-column
      *ngIf="records.length && !opened"
      label="Filter secrets"
      [groups]="filters"
      [chosen]="chosen"
      (choose)="filter($event.key, $event.value)"
    ></app-filter-column>

    <app-list label="Secrets" [loading]="loading" [class.side-alone]="!records.length">
      <ng-container listToolbar *ngIf="records.length">
        <span class="search-field toolbar-search">
          <lucide-icon name="search" [size]="16" aria-hidden="true"></lucide-icon>
          <input class="input" type="search" placeholder="Search secrets" aria-label="Search secrets"
                 [ngModel]="query" (ngModelChange)="go({ q: $event })" />
        </span>
        <ng-container *ngTemplateOutlet="addButton"></ng-container>
      </ng-container>

      <app-row *ngFor="let secret of shown" [class.is-current]="secret.record_id === openId">
        <!-- The mark of the agent it is for. -->
        <ng-container rowMark>
          <app-agent-mark *ngIf="markOf(secret); else plainMark" [name]="markOf(secret)"></app-agent-mark>
          <ng-template #plainMark>
            <lucide-icon name="key-round" [size]="20" [strokeWidth]="1.75" aria-hidden="true"></lucide-icon>
          </ng-template>
        </ng-container>
        <a rowName class="secret-row-name" [routerLink]="['/secrets', secret.record_id]" queryParamsHandling="preserve"
           [attr.aria-current]="secret.record_id === openId ? 'true' : null">{{ nameOf(secret) }}</a>
        <span rowChips class="chip warn" *ngIf="notConnected(secret)" matTooltip="Its account is not connected yet">Not connected</span>
        <span rowChips class="chip" *ngIf="secret.handing" [matTooltip]="'Waiting for ' + handingTo(secret) + ' to accept it'">Handed over</span>
        <ng-container rowMeta>
          <span class="secret-row-facts">
            <span>{{ kindOf(secret) }}</span>
            <span *ngIf="identifierOf(secret)">{{ identifierOf(secret) }}</span>
          </span>
          <span class="secret-row-facts">
            <span *ngIf="servedBy(secret).length">Used by {{ servedBy(secret).join(", ") }}</span>
            <span *ngIf="updated(secret)" [matTooltip]="updatedInFull(secret)">updated {{ updated(secret) }}</span>
            <span class="chip" [matTooltip]="sharing(secret).names">{{ sharing(secret).word }}</span>
          </span>
        </ng-container>

        <button rowActions class="icon-btn sm" type="button" *ngIf="isMine(secret)"
                [attr.aria-label]="'More for ' + nameOf(secret)" [matMenuTriggerFor]="secretMenu"
                [matMenuTriggerData]="{ secret: secret }">
          <lucide-icon name="ellipsis-vertical" [size]="16" aria-hidden="true"></lucide-icon>
        </button>
      </app-row>

      <app-empty
        *ngIf="!loading && !records.length"
        icon="key-round"
        title="No secrets yet"
        line="A secret is what an agent needs to act for you: an account it signs in to, a token for a service. It is stored encrypted, used only by the agents it lists, and never shown back."
      >
        <ng-container *ngTemplateOutlet="addButton"></ng-container>
      </app-empty>
      <app-empty
        *ngIf="records.length && !shown.length"
        icon="search-x"
        [title]="filtered ? 'No secret matches' : show === 'mine' ? 'None of these are yours' : 'Nothing is shared with you'"
        [line]="filtered ? 'Try another search, or clear the filters.' : ''"
      >
        <button class="btn" type="button" *ngIf="filtered" (click)="go({ q: '', agent: '' })">Clear the filters</button>
      </app-empty>
    </app-list>

    <!-- The secret the address names: beside the list on a wide screen,
         in its place on a narrow one. -->
    <app-secret-view
      class="side-opened"
      *ngIf="opened as secret"
      [secret]="secret"
      [shape]="shapeOf(secret.of)"
      [title]="nameOf(secret)"
      [kind]="kindOf(secret)"
      [agents]="servedBy(secret)"
      [sharing]="sharing(secret).word"
      [madeBy]="madeBy(secret)"
      [handingTo]="handingTo(secret)"
      [mine]="isMine(secret)"
      [canUpdate]="can('update')"
      [canTransfer]="can('transfer')"
      [canDelete]="can('delete')"
      [busy]="busyRef === secret.record_id"
      (closed)="closeOpened()"
      (edit)="edit(secret)"
      (connect)="connect(secret)"
      (agentsAsked)="openAgents(secret)"
      (share)="openShare(secret)"
      (handOver)="requestTransfer(secret)"
      (withdraw)="withdraw(secret)"
      (remove)="deleteOne(secret)"
    ></app-secret-view>
  </div>

  <!-- The plus alone, its words in the tooltip and read out. -->
  <ng-template #addButton>
    <button class="icon-btn primary toolbar-end" type="button" *ngIf="can('create')" (click)="add()"
            aria-label="Add a secret" matTooltip="Add a secret">
      <lucide-icon name="plus" [size]="18" aria-hidden="true"></lucide-icon>
    </button>
  </ng-template>

  <mat-menu #secretMenu="matMenu" xPosition="before">
    <ng-template matMenuContent let-secret="secret">
      <a mat-menu-item [routerLink]="['/secrets', secret.record_id]" queryParamsHandling="preserve">Open</a>
      <button mat-menu-item *ngIf="can('update')" (click)="edit(secret)">Edit</button>
      <button mat-menu-item *ngIf="connectsAccount(secret)" [disabled]="busyRef === secret.record_id" (click)="connect(secret)">
        {{ notConnected(secret) ? "Connect" : "Reconnect" }}
      </button>
      <button mat-menu-item *ngIf="can('update')" (click)="openAgents(secret)">Agents…</button>
      <button mat-menu-item *ngIf="can('update')" (click)="openShare(secret)">Share</button>
      <button mat-menu-item *ngIf="can('transfer') && !secret.handing" (click)="requestTransfer(secret)">Hand over</button>
      <button mat-menu-item *ngIf="handingOn(secret) && can('withdraw')" (click)="withdraw(secret)">Withdraw the hand-over</button>
      <button mat-menu-item *ngIf="can('delete')" [disabled]="busyRef === secret.record_id" (click)="deleteOne(secret)">Delete</button>
    </ng-template>
  </mat-menu>

  <app-share-dialog *ngIf="share.ref"
                    [share]="share"
                    heading="Who can see this secret"
                    note="The people you share with can let their own agents use it. Its values are still never shown to anyone."
                    [allowOrganization]="!!share.peers.everyone"
                    [problem]="shareProblem"
                    (save)="saveShare()" (closed)="share.close()">
  </app-share-dialog>

  <app-record-agents *ngIf="agentsTarget as secret"
                     [record]="secret" [shapes]="shapes" [busy]="agentsSaving" [problem]="agentsProblem"
                     (save)="saveAgents($event)" (closed)="closeAgents()">
  </app-record-agents>

  <app-transfer-dialog *ngIf="transferTarget as item"
                       [subject]="'the secret “' + nameOf(item) + '”'" [ownerId]="item.created_by"
                       note="Once they accept it, it is theirs to change and delete. Everyone it is shared with keeps seeing it."
                       [busy]="transferring" (chosen)="transfer($event)" (closed)="closeTransfer()">
  </app-transfer-dialog>
</app-page>
