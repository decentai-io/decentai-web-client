<div class="model-select">
  <app-select
    label="Connection"
    [choices]="providerChoices"
    [disabled]="disabled"
    [ngModel]="connectionId"
    (ngModelChange)="chooseConnection($event)"
  ></app-select>

  <ng-container *ngIf="connectionId">
    <app-select
      *ngIf="!typing"
      label="Model"
      placeholder="Choose a model"
      [choices]="modelChoices"
      [disabled]="disabled"
      [ngModel]="model"
      (ngModelChange)="chooseModel($event)"
    ></app-select>

    <span class="model-typed" *ngIf="typing">
      <input
        class="input"
        aria-label="Model id"
        placeholder="The provider's own id for the model"
        [disabled]="disabled"
        [ngModel]="model"
        (ngModelChange)="typeModel($event)"
      />
      <button class="btn" type="button" *ngIf="models.length" [disabled]="disabled" (click)="pickFromList()">
        Choose from the list
      </button>
    </span>
  </ng-container>
</div>
