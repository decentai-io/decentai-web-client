<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <!-- What the page may load and where it may send, from wherever it
         is served (a static host sends no header of its own): itself,
         the two Google hosts that serve the IBM Plex fonts, pictures
         and media from blobs of its own. Styles need 'unsafe-inline'
         because Angular writes component styles into the page; scripts
         do not. connect-src is every origin, because the engine's
         address is chosen at run time (the Connect screen, or
         assets/config.json): a deployment that knows its engine may
         tighten it to 'self', the font hosts and that engine, in its
         http(s) and ws(s) forms (docs/hosting.md). The container's
         Caddyfile adds frame-ancestors, which a meta tag cannot carry. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src * ws: wss:; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"/>
    <base href="/"/>
    <title>DecentAI</title>
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48"/>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/icons/decentai-mark-32.png"/>
    <link rel="icon" type="image/png" sizes="256x256" href="assets/brand/icons/decentai-mark-256.png"/>
    <link rel="apple-touch-icon" sizes="180x180" href="assets/brand/icons/decentai-mark-180.png"/>
    <meta name="theme-color" content="#ffffff"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="DecentAI"/>
    <meta property="og:title" content="DecentAI"/>
    <meta property="og:description" content="AI agents built for the enterprise. Runs in your environment. Every agent approved by you. Every action logged."/>
    <meta property="og:image" content="assets/brand/icons/decentai-og-1200x630.png"/>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
    <link rel="manifest" href="manifest.webmanifest">
    <!-- Sets the saved theme before the first paint. A file rather than
         inline, so a content security policy can allow scripts from this
         origin alone. -->
    <script src="theme-init.js"></script>
</head>

  <body class="mat-typography">
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
